name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: golangci-lint run
      - run: scripts/gen-compat.sh
      - run: git diff --exit-code testdata/compat/expected
      - run: go test ./...
