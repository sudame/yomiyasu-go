anchor = "\n| 目的は、機能の追加ではなく使いやすさの向上です。 | 機能の追加ではなく、使いやすさを高めることが目的です。 | 否定対比が方針の切り替えを示しているため、否定を残して表現を整える。 |"
replace = ""
count = 1

[[patch]]
id = "neg-catalog-row"
rules = ["negative_parallelism"]
file = "references/slop-catalog.md"
anchor = "\n| *it is not X, it is Y* | 「Xではなく、Yです」 | 単なる修辞でXを削っても通じる場合は「Yです」とする。Xと誤解されやすい点への反論や見方の切り替えを担っている場合は、否定を残して「Xではなく、Yです」と自然に整える（Aに加えてBなどに改変しない。「そのもの」等の余計な強調語は足さない）。 |"
replace = ""
count = 1

# meta_filler と negative_parallelism の両方が無効なとき。

[[patch]]
id = "filler-neg-skill-section"
rules = ["meta_filler", "negative_parallelism"]
file = "SKILL.md"
section = "### セルフラベリングと否定対比の整理"
replace = ""

[[patch]]
id = "filler-neg-skill-step2-6"
rules = ["meta_filler", "negative_parallelism"]
file = "SKILL.md"
anchor = "6. 「重要なのは」が評価を担っているときは述語に残し、否定対比（AではなくB）は意味や比重を担っているなら否定を残したまま表現を整えます。"
target = "「重要なのは」が評価を担っているときは述語に残し、否定対比（AではなくB）は意味や比重を担っているなら否定を残したまま表現を整えます。"
replace = "前置き、定型の結び、否定対比（AではなくB）は、元の文のまま残します。"
count = 1

