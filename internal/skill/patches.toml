# excess_bold と bold_not_rendered: 「装飾記号と不要な空白の排除」の太字の段落は、2 つの規則の組み合わせごとに書き換える。

[[patch]]
id = "bold-para-bnr"
rules = ["bold_not_rendered"]
unless = ["excess_bold"]
file = "SKILL.md"
anchor = "\nまた、Markdownとして表示される文章（GitHubや技術記事など）で太字を残すときは、太字として正しく表示される書き方に整えます。GitHubなどでは、`**` のすぐ内側が記号（「」『』（）【】、。やバッククォート等）で、すぐ外側が文字（ひらがな・漢字・英数字）だと、太字にならず `**` がそのまま表示されてしまいます。太字を残すときは、次の優先順で直します。\n1. かっこごと太字にしているときは、かっこの内側だけを太字にします（例: `次に**「文書の立場」**を決めます。` → `次に「**文書の立場**」を決めます。`）。\n2. 太字の終わりが句点などのときは、句点を太字の外に出します（例: `これは**必須です。**詳しくは下に書きます。` → `これは**必須です**。詳しくは下に書きます。`）。\n3. 1と2ができないとき（コードで始まる・終わる太字、かっこが2つ以上ある太字など）は、`**` の外側の、文字に接する側に半角スペースを1つ入れます（例: `立場は**「勧め」か「決まり」**で決めます。` → `立場は **「勧め」か「決まり」** で決めます。`）。\nこの半角スペースは表示のためのものであり、排除対象の不自然な半角空白には当たらないため消しません。\n元の文で太字にならない書き方になっている箇所は、太字を残すなら、ほかに直す箇所がない文でも同様に直します（意味は変わらないため「変えたところ」には書きません）。これは太字を増やす決まりではなく、太字を減らす決まり（domains/tech.md の1,000文字あたり1〜2箇所など）はそのまま維持します。"
replace = "\n太字を減らす決まり（domains/tech.md の1,000文字あたり1〜2箇所など）はそのまま維持します。"
count = 1

